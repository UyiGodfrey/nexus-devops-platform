replicaCount: 2

image:
  repository: nexus-api
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

readinessProbe:
  path: /health
  port: 3000

livenessProbe:
  path: /health
  port: 3000
